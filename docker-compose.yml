# Editor de arquitetura de sistemas mecatronicos (mechart) — DESENVOLVIMENTO.
#
#   docker compose up -d --build   sobe em http://localhost:5180 (hot reload)
#   docker compose logs -f         acompanha o Vite
#   docker compose down            para
#
# O codigo do host e montado em /app: editar um arquivo recarrega o navegador.
# Mudou package.json? Rode `docker compose up -d --build` de novo.
# A versao estatica endurecida (nginx) esta em docker-compose.prod.yml.

services:
  mechart-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: mechart:dev
    container_name: mechart-dev
    ports:
      - "5180:5180"
    environment:
      # Bind mounts no Docker Desktop do Mac nao propagam eventos de arquivo
      # de forma confiavel; o polling garante o hot reload.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - .:/app
      # node_modules do container (binarios Linux) nao pode ser o do Mac.
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
