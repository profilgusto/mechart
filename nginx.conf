# Runtime estatico do mechart: serve dist/ e mais nada.
# Roda na imagem nginx-unprivileged (usuario nao-root, porta 8080).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do nginx nas respostas.
    server_tokens off;

    # --- Headers de seguranca ---
    # Ficam no bloco server e valem para todos os locations. Os locations abaixo
    # NAO usam add_header (so `expires`), porque no nginx um add_header num
    # location descarta os add_header herdados do server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    # Assets com hash no nome: cache longo e imutavel.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Shell do SPA: sempre revalidar, para uma versao nova entrar sem cache velho.
    location = /index.html {
        expires -1;
    }

    # Fallback de SPA: qualquer rota desconhecida devolve o shell do app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Compressao ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
